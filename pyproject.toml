[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "security-agent-skills"
version = "0.1.0a1"
description = "Local security workflows for agent packages, MCP servers, and application folders"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Fliorcie Labs"}]
dependencies = []

[project.scripts]
security-agent-skills = "security_agent_skills.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["skills/*/scripts/_security_agent_skills"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
"tests/test_portability.py" = ["E402"]

[tool.black]
target-version = ["py311"]
line-length = 100
extend-exclude = "skills/.*/scripts/_security_agent_skills"

[tool.mypy]
python_version = "3.11"
files = ["src"]
check_untyped_defs = true
ignore_missing_imports = false
