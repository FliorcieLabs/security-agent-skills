name: Quality
on:
  push:
    branches: [main, integ]
  pull_request:
    branches: [main, integ]
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    name: tests (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.14']
    env:
      PYTHONPATH: src
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -t . -v
      - run: python scripts/validate_skills.py
      - run: python scripts/build_skills.py --check
  quality:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check src scripts tests
      - run: python -m mypy src
      - run: python -m black --check src scripts tests
      - run: python scripts/validate_specs.py
      - run: python scripts/benchmark_reports.py
      - run: python -m build
      - run: python scripts/package_smoke.py
  quality-gate:
    name: quality-gate
    if: always()
    needs: [tests, quality]
    runs-on: ubuntu-latest
    steps:
      - name: Require all validation jobs
        env:
          TESTS: ${{ needs.tests.result }}
          QUALITY: ${{ needs.quality.result }}
        run: test "$TESTS" = success && test "$QUALITY" = success
